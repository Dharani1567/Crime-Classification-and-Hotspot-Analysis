<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK Police Cyber-Spatial Hotspot Intelligence</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #030712;
            color: #f3f4f6;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #map {
            height: 100vh;
            width: 100vw;
            background: #030712;
        }
        
        /* Glassmorphism Cyber HUD */
        .cyber-hud {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 1000;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 204, 0.25);
            border-radius: 18px;
            padding: 22px 26px;
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.7), 0 0 25px rgba(0, 255, 204, 0.15);
            max-width: 360px;
            pointer-events: auto;
        }
        .hud-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 255, 204, 0.12);
            color: #00ffcc;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            margin-bottom: 12px;
        }
        .hud-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #00ffcc;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ffcc;
            animation: pulse 1.5s infinite;
        }
        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 0.5px;
            color: #ffffff;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #ffffff 0%, #a7f3d0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hud-subtitle {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 18px;
            line-height: 1.4;
        }
        
        /* KPI Metrics Grid */
        .kpi-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 18px;
        }
        .kpi-card {
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px 12px;
        }
        .kpi-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: #f8fafc;
        }
        .kpi-lbl {
            font-size: 10px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-top: 2px;
        }
        
        /* Layer Filter Buttons */
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .filter-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .filter-btn:hover {
            background: rgba(30, 41, 59, 0.9);
            border-color: #00ffcc;
            transform: translateX(3px);
        }
        .filter-btn.active {
            background: rgba(0, 255, 204, 0.15);
            border-color: #00ffcc;
            color: #00ffcc;
        }
        .sev-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        
        /* Floating Action Buttons */
        .floating-tools {
            position: absolute;
            bottom: 28px;
            right: 28px;
            z-index: 1000;
            display: flex;
            gap: 12px;
        }
        .tool-btn {
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 204, 0.3);
            color: #00ffcc;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: all 0.2s;
        }
        .tool-btn:hover {
            background: #00ffcc;
            color: #030712;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            transform: translateY(-2px);
        }
        
        /* Scanner Radar Effect */
        .radar-box {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 1000;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 1px solid rgba(0, 255, 204, 0.4);
            background: radial-gradient(circle, rgba(0, 255, 204, 0.08) 0%, rgba(3, 7, 18, 0.8) 70%);
            overflow: hidden;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }
        .radar-sweep {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, rgba(0, 255, 204, 0.5) 0deg, transparent 60deg);
            animation: rotateRadar 3s linear infinite;
        }
        
        @keyframes rotateRadar {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }
        
        /* Custom Neon Popups */
        .leaflet-popup-content-wrapper {
            background: rgba(11, 15, 25, 0.95) !important;
            backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(0, 255, 204, 0.4) !important;
            border-radius: 14px !important;
            color: #f8fafc !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 255, 204, 0.2) !important;
        }
        .leaflet-popup-tip {
            background: rgba(11, 15, 25, 0.95) !important;
            border: 1px solid rgba(0, 255, 204, 0.4) !important;
        }
        .pop-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #00ffcc;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 4px;
        }
        .pop-row {
            font-size: 11px;
            margin: 4px 0;
            color: #94a3b8;
        }
        .pop-row b {
            color: #f1f5f9;
        }
        .pop-badge {
            display: inline-block;
            margin-top: 6px;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Scanner Radar HUD -->
    <div class="radar-box">
        <div class="radar-sweep"></div>
    </div>

    <!-- Main Glassmorphism HUD -->
    <div class="cyber-hud">
        <div class="hud-badge">CYBER-SPATIAL INTELLIGENCE</div>
        <div class="hud-title">UK CRIME RADAR</div>
        <div class="hud-subtitle">Spatial Hotspot Surveillance & Cluster Decomposition</div>

        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-val" style="color:#00ffcc;">95.3%</div>
                <div class="kpi-lbl">Model Accuracy</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-val" style="color:#ff0055;">174.2K</div>
                <div class="kpi-lbl">Incidents Tracked</div>
            </div>
        </div>

        <div style="font-size: 11px; font-weight:700; color:#64748b; letter-spacing:1px; margin-bottom:8px; text-transform:uppercase;">
            Filter Threat Tiers
        </div>
        <div class="filter-group">
            <button class="filter-btn active" onclick="filterHotspots('ALL')">
                <span><span class="sev-dot" style="background:#00ffcc; box-shadow:0 0 8px #00ffcc;"></span>ALL HOTSPOTS</span>
                <span id="cnt-all">4,500</span>

            <button class="filter-btn" onclick="filterHotspots('CRITICAL')">

                <span id="cnt-crit" style="color:#ff0055;">Top Tier</span>
            </button>
            <button class="filter-btn" onclick="filterHotspots('HIGH RISK')">
                <span><span class="sev-dot" style="background:#ffaa00; box-shadow:0 0 8px #ffaa00;"></span>HIGH RISK</span>
                <span id="cnt-high" style="color:#ffaa00;">Elevated</span>
            </button>
        </div>
    </div>

    <!-- Floating Action Quick Views -->
    <div class="floating-tools">
        <button class="tool-btn" onclick="zoomTo(51.5074, -0.1278, 12)">📍 LONDON CORE</button>
        <button class="tool-btn" onclick="zoomTo(52.4862, -1.8904, 11)">📍 BIRMINGHAM</button>
        <button class="tool-btn" onclick="zoomTo(53.4808, -2.2426, 11)">📍 MANCHESTER</button>
        <button class="tool-btn" onclick="toggleHeatmap()">🔥 TOGGLE HEAT</button>
    </div>

            radius: 18,
            blur: 22,
            maxZoom: 13,

        function toggleHeatmap() {

            }
            heatVisible = !heatVisible;
        }

        // Hotspot Circle Layer Group
        let markersGroup = L.layerGroup().addTo(map);

        function renderPoints(filterSev) {
            markersGroup.clearLayers();
            rawPoints.forEach(p => {
                if (filterSev === 'ALL' || p.sev === filterSev) {
                    const badgeBg = p.sev === 'CRITICAL' ? 'rgba(255,0,85,0.2)' : (p.sev === 'HIGH RISK' ? 'rgba(255,170,0,0.2)' : 'rgba(0,255,204,0.2)');
                    const badgeCol = p.sev === 'CRITICAL' ? '#ff0055' : (p.sev === 'HIGH RISK' ? '#ffaa00' : '#00ffcc');

                    const marker = L.circleMarker([p.lat, p.lng], {
                        radius: p.rad,
                        color: p.color,
                        weight: 1.5,
                        fillColor: p.color,
                        fillOpacity: 0.75
                    });

                    const popup = `
                        <div class="pop-title">⚡ SPATIAL HOTSPOT NODE</div>
                        <div class="pop-row">Cell Grid: <b>${p.cell}</b></div>
                        <div class="pop-row">Coordinates: <b>${p.lat}, ${p.lng}</b></div>
                        <div class="pop-row">Prior Crime Volume: <b>${p.vol}</b></div>
                        <div class="pop-badge" style="background:${badgeBg}; color:${badgeCol};">${p.sev} THREAT</div>
                    `;
                    marker.bindPopup(popup);
                    markersGroup.addLayer(marker);
                }
            });
        }

        renderPoints('ALL');

        function filterHotspots(sev) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            renderPoints(sev);
